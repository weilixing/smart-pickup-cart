# robot_localization EKF：融合轮式里程计（MCU 积分）+ IMU，发布 odom -> base_footprint
ekf_filter_node:
  ros__parameters:
    frequency: 30.0
    two_d_mode: true
    publish_tf: true
    map_frame: map
    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: odom

    odom0: odom
    #            x      y      z      roll   pitch  yaw    vx     vy     vz     vroll  vpitch vyaw   ax     ay     az
    odom0_config: [false, false, false, false, false, true,  true,  true,  false, false, false, true,  false, false, false]
    odom0_differential: false
    odom0_queue_size: 10

    imu0: imu/data_raw
    imu0_config: [false, false, false, false, false, false, false, false, false, false, false, true,  true,  false, false]
    imu0_remove_gravitational_acceleration: true
    imu0_queue_size: 10
